name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VER_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Detected version string: $JAVA_VER_OUTPUT"

          JAVA_MAJOR=$(echo "$JAVA_VER_OUTPUT" | sed -E 's/.*version "([0-9]+).*/\1/')
          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "Error: Could not detect active Java major version."
            exit 1
          fi

          echo "Active Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version must be 17 or newer, but detected $JAVA_MAJOR."
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking Temporary Debug Keystore ==="
          if [ ! -f ./debug.keystore ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "./debug.keystore already exists."
          fi

          if [ ! -f ./debug.keystore ]; then
            echo "Error: Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          echo "=== Verifying Debug APK ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at $EXPECTED_APK"
            echo "Scanning only inside app/build/outputs/apk for diagnostic information:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: Discovered APK file $EXPECTED_APK is empty (0 bytes)."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: $EXPECTED_APK does not have .apk extension."
              exit 1
              ;;
          esac

          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || wc -c < "$EXPECTED_APK")
          echo "Verified $EXPECTED_APK exists and is valid ($APK_SIZE bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          echo "=== Preparing APK Release Asset ==="
          ASSET_DIR="${RUNNER_TEMP}/release_asset"
          mkdir -p "$ASSET_DIR"

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          ASSET_NAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"

          cp -p "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi

          echo "Prepared release asset: $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing to GitHub Releases ==="
          gh --version

          ASSET_PATH="${{ steps.prep_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset missing or empty: $ASSET_PATH"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES=$(cat <<EOF
          ### Automated Debug Build
          - **Build Type**: Automatically generated debug APK
          - **Built By**: GitHub Actions
          - **Run Number**: ${GITHUB_RUN_NUMBER}
          - **Run Attempt**: ${GITHUB_RUN_ATTEMPT}
          - **Source Commit**: ${GITHUB_SHA}
          - **Notice**: This APK is intended for testing purposes. It is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Download & Release Status Report ==="
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${{ steps.prep_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "GitHub Release published successfully."
            gh release view "$RELEASE_TAG"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")
            
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            echo "### 📱 Debug APK Download" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK has been published to GitHub Releases:" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page**: [$RELEASE_TITLE]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Download File**: Direct download available under the Assets section of the release ($ASSET_NAME)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Backup**: The standard GitHub Actions artifact \`app-debug-apk\` is also preserved and available for download." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing was not completed or encountered an error."
            echo "The debug APK was built successfully."
            echo "The GitHub Actions artifact named 'app-debug-apk' remains available for download."

            echo "### ⚠️ Debug APK Available via Actions Artifacts" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Release publishing could not be completed, but the APK build succeeded:" >> "$GITHUB_STEP_SUMMARY"
            echo "- The debug APK was built and verified successfully." >> "$GITHUB_STEP_SUMMARY"
            echo "- The artifact **\`app-debug-apk\`** is available in the workflow run Summary." >> "$GITHUB_STEP_SUMMARY"
          fi
